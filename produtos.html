  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const produtosContainer = document.getElementById('produtosContainer');
        const whatsappBaseLink = 'https://api.whatsapp.com/send/?phone=5531992416125&text&type=phone_number&app_absent=0';
        const whatsappBaseUrl = whatsappBaseLink + '&text=';

        function createProductCard(product) {
            const precoFormatado = parseFloat(product.preco).toFixed(2).replace('.', ',');
            let imagensHtml = '';
            if (product.imagem) {
                const imagens = product.imagem.split(',').map(img => img.trim());
                if (imagens.length > 1) {
                    imagensHtml = `
                        <div class="banner">
                            <div class="banner-slider">
                                ${imagens.map(img => `<img src="img/produtos/${img}" alt="${product.nome}">`).join('')}
                            </div>
                        </div>`;
                } else if (imagens.length === 1 && imagens[0]) {
                    imagensHtml = `<img src="img/produtos/${imagens[0]}" alt="${product.nome}" class="produto-imagem">`;
                }
            }
            return `
                <div class="produto-card">
                    ${imagensHtml}
                    <h2>${product.nome}</h2>
                    <p>${product.descricao}</p>
                    <p class="preco">R$ ${precoFormatado}</p>
                    <a href="#" class="btn-whatsapp" data-product="${product.nome} - ${product.descricao} (R$ ${precoFormatado})">Comprar no WhatsApp</a>
                </div>
            `;
        }

        function setupWhatsappLinks() {
            document.querySelectorAll('.btn-whatsapp').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const productName = this.getAttribute('data-product');
                    let message = 'Olá! Gostaria de comprar o seguinte produto da Banda Juros Simples: ' + productName + '. Por favor, me ajude a finalizar o pedido.';
                    const encodedMessage = encodeURIComponent(message);
                    const whatsappLink = whatsappBaseUrl + encodedMessage;
                    window.open(whatsappLink, '_blank');
                });
            });
        }

        async function fetchProducts() {
            try {
                const snapshot = await db.collection("produto").orderBy("criadoEm", "desc").get();
                let productsHtml = '';
                if (snapshot.empty) {
                    productsHtml = '<p style="color: white;">Nenhum produto encontrado. Aguarde novas atualizações da equipe!</p>';
                } else {
                    snapshot.forEach(doc => {
                        const product = doc.data();
                        productsHtml += createProductCard(product);
                    });
                }
                produtosContainer.innerHTML = productsHtml;
                setupWhatsappLinks();
            } catch (error) {
                console.error("Erro ao buscar produtos: ", error);
                produtosContainer.innerHTML = '<p style="color: red;">Erro ao carregar produtos. Verifique sua conexão com o Firebase e regras de segurança (read: true).</p>';
            }
        }

        fetchProducts();
    });
  </script>
  <script src="js/script.js"></script>
