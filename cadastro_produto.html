<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; 
    font-src 'self' https://cdnjs.cloudflare.com;
    script-src 'self' https://code.jquery.com https://www.gstatic.com 'unsafe-inline';
    connect-src 'self' https://firestore.googleapis.com https://www.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com;
  ">
  <title>Banda Juros Simples - Cadastro de Produto</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <style>
    .format-buttons {
      margin-bottom: 10px;
    }
    .format-buttons button {
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px solid var(--cor-secundaria);
      background-color: var(--cor-primaria);
      color: var(--cor-texto);
      font-size: 12px;
      cursor: pointer;
      margin-right: 5px;
      transition: background-color 0.3s;
    }
    .format-buttons button:hover {
      background-color: var(--cor-secundaria);
      color: var(--cor-primaria);
    }
    .format-info {
      font-size: 12px;
      margin-top: -10px;
      margin-bottom: 10px;
      color: #aaa;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBfcfEFiaZOvh5QxePXkbwqE-aPWlpy5kQ",
      authDomain: "juros-simples-site.firebaseapp.com",
      projectId: "juros-simples-site",
      storageBucket: "juros-simples-site.firebasestorage.app",
      messagingSenderId: "442413466029",
      appId: "1:442413466029:web:7818f12c547b3c9ce2a124",
      measurementId: "G-9P99CN9HDS"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Proteção de Rota
    auth.onAuthStateChanged(function(user) {
        if (!user) {
            console.log("Usuário não autenticado. Redirecionando para login.html");
            window.location.href = 'login.html';
        }
    });
  </script>
</head>
<body class="imagem-fundo">

  <nav class="navbar">
    <div class="navbar-brand">
      <a href="#">Admin</a>
    </div>
    <div class="navbar-toggler">
      <i class="fa fa-bars"></i>
    </div>
    <div class="navbar-links">
      <a href="cadastro_produto.html">Cadastrar Produto</a>
      <a href="cadastro_musica.html">Cadastrar Música</a>
      <a href="deletar_produto.html">Deletar Produto</a>
      <a href="deletar_musica.html">Deletar Música</a>
      <a href="#" id="logoutBtn">Sair</a>
    </div>
  </nav>

  <main>
    <div class="form-container">
        <h1>Cadastro de Novo Produto</h1>
        <form id="formCadastroProduto">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Camiseta Juros Simples" required>
            
            <label for="descricao">Descrição:</label>
            <div class="format-buttons">
                <button type="button" onclick="insertTag('b')">negrito</button>
                <button type="button" onclick="insertTag('i')">itálico</button>
                <button type="button" onclick="insertTag('u')">sublinhar</button>
                <button type="button" onclick="insertTag('br')">quebra de linha</button>
                <button type="button" onclick="insertTag('ul')">lista</button>
            </div>
            <textarea id="descricao" name="descricao" rows="10" placeholder="Descrição detalhada do produto..." required></textarea>
            
            <label for="preco">Preço (R$):</label>
            <input type="number" id="preco" name="preco" min="0.01" step="0.01" placeholder="0.00" required>

            <label for="imagem">Nome da Imagem:</label>
            <input type="text" id="imagem" name="imagem" placeholder="Ex: camisa_branca.jpg">

            <label for="linkMercadoLivre">Link Mercado Livre:</label>
            <input type="url" id="linkMercadoLivre" name="linkMercadoLivre" placeholder="https://">

            <label for="linkAmazon">Link Amazon:</label>
            <input type="url" id="linkAmazon" name="linkAmazon" placeholder="https://">
            
            <button type="submit">Cadastrar Produto</button>
        </form>
        <p id="mensagemStatus" style="margin-top: 20px;">Preencha os dados e clique em Cadastrar.</p>
    </div>
  </main>

  <footer>
    <div class="divRepart">
      <p><i class="fa fa-copyright"></i> 2025 Banda Juros Simples - Desenvolvido por 
      <a href="https://www.instagram.com/Vitoria_Desenvolvedora" target="_blank"><i class="fa fa-instagram"></i>Vitoria</a></p>
      <p>Contato: <a href="mailto:contato@jurossimples.com.br">contato@jurossimples.com.br</a></p>
    </div>
  </footer>

  <script>
    function insertTag(tag) {
        const textarea = document.getElementById('descricao');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selectedText = textarea.value.substring(start, end);
        let content;

        if (tag === 'br') {
            content = '<br>';
        } else if (tag === 'ul') {
            content = '<ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n</ul>';
        } 
        else {
            content = `<${tag}>${selectedText}</${tag}>`;
        }
        
        textarea.value = textarea.value.substring(0, start) + content + textarea.value.substring(end);
        textarea.focus();
        const newCursorPos = start + content.length;
        textarea.setSelectionRange(newCursorPos, newCursorPos);
    }

    document.getElementById('logoutBtn').addEventListener('click', function() {
        auth.signOut().then(() => {
            console.log('Logout bem-sucedido.');
            window.location.href = 'login.html';
        }).catch((error) => {
            console.error('Erro ao fazer logout:', error);
        });
    });

    document.getElementById('formCadastroProduto').addEventListener('submit', async function(e) {
        e.preventDefault();
        const statusElement = document.getElementById('mensagemStatus');
        const nome = document.getElementById('nome').value;
        const descricao = document.getElementById('descricao').value;
        const preco = parseFloat(document.getElementById('preco').value);
        const imagem = document.getElementById('imagem').value;
        const linkMercadoLivre = document.getElementById('linkMercadoLivre').value;
        const linkAmazon = document.getElementById('linkAmazon').value;

        const user = auth.currentUser;
        if (!user) {
            statusElement.style.color = 'red';
            statusElement.innerText = 'Você precisa estar logado para cadastrar um produto.';
            return;
        }

        if (isNaN(preco)) {
            statusElement.style.color = 'red';
            statusElement.innerText = 'Erro: Preço inválido.';
            return;
        }

        statusElement.style.color = 'yellow';
        statusElement.innerText = 'Salvando dados do produto...';

        try {
            await db.collection("produto").add({
                nome: nome,
                descricao: descricao,
                preco: preco,
                imagem: imagem,
                linkMercadoLivre: linkMercadoLivre,
                linkAmazon: linkAmazon,
                criadoEm: firebase.firestore.FieldValue.serverTimestamp()
            });
            statusElement.style.color = 'lightgreen';
            statusElement.innerText = 'Produto cadastrado com sucesso!';
            document.getElementById('formCadastroProduto').reset();
        } catch (error) {
            console.error("Erro ao salvar no Firestore: ", error);
            statusElement.style.color = 'red';
            if (error.code && error.code.includes('permission-denied')) {
                statusElement.innerText = 'Erro de permissão: Verifique as Regras de Segurança do Firestore.';
            } else {
                statusElement.innerText = 'Erro ao salvar dados do produto. Verifique o console.';
            }
        }
    });
  </script>
  <script src="js/script.js"></script>

</body>
</html>
