<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; 
    font-src 'self' https://cdnjs.cloudflare.com;
    script-src 'self' https://code.jquery.com https://www.gstatic.com 'unsafe-inline';
    connect-src 'self' https://firestore.googleapis.com https://www.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com;
  ">
  <title>Banda Juros Simples - Deletar Música</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBfcfEFiaZOvh5QxePXkbwqE-aPWlpy5kQ",
      authDomain: "juros-simples-site.firebaseapp.com",
      projectId: "juros-simples-site",
      storageBucket: "juros-simples-site.firebasestorage.app",
      messagingSenderId: "442413466029",
      appId: "1:442413466029:web:7818f12c547b3c9ce2a124",
      measurementId: "G-9P99CN9HDS"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Proteção de Rota
    auth.onAuthStateChanged(function(user) {
        if (!user) {
            console.log("Usuário não autenticado. Redirecionando para login.html");
            window.location.href = 'login.html';
        } else {
            // Usuário autenticado, pode buscar as músicas.
            fetchMusicasForDeletion();
        }
    });
  </script>
</head>
<body class="imagem-fundo">

  <nav class="navbar">
    <div class="navbar-brand">
      <a href="#">Admin</a>
    </div>
    <div class="navbar-toggler">
      <i class="fa fa-bars"></i>
    </div>
    <div class="navbar-links">
      <a href="cadastro_produto.html">Cadastrar Produto</a>
      <a href="cadastro_musica.html">Cadastrar Música</a>
      <a href="deletar_produto.html">Deletar Produto</a>
      <a href="deletar_musica.html">Deletar Música</a>
      <a href="#" id="logoutBtn">Sair</a>
    </div>
  </nav>

  <main>
    <div class="titulo_musicas">
        <h1>Deletar Músicas</h1>
    </div>
    <div id="deleteContainer" class="musicas-container">
        <p style="color: yellow;">Verificando autenticação...</p>
    </div>
  </main>

  <footer>
    <div class="divRepart">
      <p><i class="fa fa-copyright"></i> 2025 Banda Juros Simples - Desenvolvido por 
      <a href="https://www.instagram.com/Vitoria_Desenvolvedora" target="_blank"><i class="fa fa-instagram"></i>Vitoria</a></p>
      <p>Contato: <a href="mailto:contato@jurossimples.com.br">contato@jurossimples.com.br</a></p>
    </div>
  </footer>

  <script>
    document.getElementById('logoutBtn').addEventListener('click', function(e) {
        e.preventDefault();
        auth.signOut().then(() => {
            console.log('Logout bem-sucedido.');
            window.location.href = 'login.html';
        }).catch((error) => {
            console.error('Erro ao fazer logout:', error);
        });
    });

    const deleteContainer = document.getElementById('deleteContainer');

    async function fetchMusicasForDeletion() {
        deleteContainer.innerHTML = '<p style="color: yellow;">Carregando músicas para deleção...</p>';
        try {
            const snapshot = await db.collection("musicasBanda").orderBy("criadoEm", "desc").get();
            let musicasHtml = "";

            if (snapshot.empty) {
                musicasHtml = '<p style="color: white;">Nenhuma música encontrada.</p>';
            } else {
                snapshot.forEach(doc => {
                    const musica = doc.data();
                    musicasHtml += `
                        <div class="musica-card" id="musica-${doc.id}">
                            <h2>${musica.nome}</h2>
                            <button class="btn-delete" data-id="${doc.id}">Deletar</button>
                        </div>
                    `;
                });
            }
            
            deleteContainer.innerHTML = musicasHtml;
            setupDeleteButtons();
            
        } catch (error) {
            console.error("Erro ao buscar músicas: ", error);
            deleteContainer.innerHTML = '<p style="color: red;">Erro de permissão ao carregar músicas. Verifique as regras do Firestore.</p>';
        }
    }

    function setupDeleteButtons() {
        document.querySelectorAll('.btn-delete').forEach(button => {
            button.addEventListener('click', async function() {
                const musicaId = this.getAttribute('data-id');
                if (confirm('Tem certeza que deseja deletar esta música? Esta ação não pode ser desfeita.')) {
                    try {
                        await db.collection("musicasBanda").doc(musicaId).delete();
                        const musicaCard = document.getElementById(`musica-${musicaId}`);
                        if(musicaCard) {
                            musicaCard.remove();
                        }
                        alert('Música deletada com sucesso!');
                    } catch (error) {
                        console.error("Erro ao deletar música: ", error);
                        alert('Erro de permissão ao deletar música. Verifique as regras do Firestore.');
                    }
                }
            });
        });
    }
  </script>
  <script src="js/script.js"></script>

</body>
</html>
