<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; 
    font-src 'self' https://cdnjs.cloudflare.com;
    script-src 'self' https://code.jquery.com https://www.gstatic.com 'unsafe-inline';
    connect-src 'self' https://firestore.googleapis.com https://www.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com;
  ">
  <title>Banda Juros Simples - Cadastro de Música</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBfcfEFiaZOvh5QxePXkbwqE-aPWlpy5kQ",
      authDomain: "juros-simples-site.firebaseapp.com",
      projectId: "juros-simples-site",
      storageBucket: "juros-simples-site.firebasestorage.app",
      messagingSenderId: "442413466029",
      appId: "1:442413466029:web:7818f12c547b3c9ce2a124",
      measurementId: "G-9P99CN9HDS"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Proteção de Rota
    auth.onAuthStateChanged(function(user) {
        if (!user) {
            console.log("Usuário não autenticado. Redirecionando para login.html");
            window.location.href = 'login.html';
        }
    });
  </script>
</head>
<body class="imagem-fundo">

  <nav class="navbar">
    <div class="navbar-brand">
      <a href="#">Admin</a>
    </div>
    <div class="navbar-toggler">
      <i class="fa fa-bars"></i>
    </div>
    <div class="navbar-links">
      <a href="cadastro_produto.html">Cadastrar Produto</a>
      <a href="cadastro_musica.html">Cadastrar Música</a>
      <a href="deletar_produto.html">Deletar Produto</a>
      <a href="deletar_musica.html">Deletar Música</a>
      <a href="#" id="logoutBtn">Sair</a>
    </div>
  </nav>

  <main>
    <div class="form-container">
        <h1>Cadastro de Nova Música</h1>
        <form id="formCadastroMusica">
            <label for="nome">Nome da Música:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Manhãs de Setembro" required>
            
            <label for="spotifyLink">Link do Spotify:</label>
            <input type="url" id="spotifyLink" name="spotifyLink" placeholder="https://open.spotify.com/..." required>
            
            <label for="imagem">Nome da Imagem:</label>
            <input type="text" id="imagem" name="imagem" placeholder="Ex: capa_album.jpg">
            
            <button type="submit">Cadastrar Música</button>
        </form>
        <p id="mensagemStatus" style="margin-top: 20px;">Preencha os dados e clique em Cadastrar.</p>
    </div>
  </main>

  <footer>
    <div class="divRepart">
      <p><i class="fa fa-copyright"></i> 2025 Banda Juros Simples - Desenvolvido por 
      <a href="https://www.instagram.com/Vitoria_Desenvolvedora" target="_blank"><i class="fa fa-instagram"></i>Vitoria</a></p>
      <p>Contato: <a href="mailto:contato@jurossimples.com.br">contato@jurossimples.com.br</a></p>
    </div>
  </footer>

  <script>
    document.getElementById('logoutBtn').addEventListener('click', function() {
        auth.signOut().then(() => {
            console.log('Logout bem-sucedido.');
            window.location.href = 'login.html';
        }).catch((error) => {
            console.error('Erro ao fazer logout:', error);
        });
    });

    document.getElementById('formCadastroMusica').addEventListener('submit', async function(e) {
        e.preventDefault();
        const statusElement = document.getElementById('mensagemStatus');
        const nome = document.getElementById('nome').value;
        const spotifyLink = document.getElementById('spotifyLink').value;
        const imagem = document.getElementById('imagem').value;

        const user = auth.currentUser;
        if (!user) {
            statusElement.style.color = 'red';
            statusElement.innerText = 'Você precisa estar logado para cadastrar uma música.';
            return;
        }

        statusElement.style.color = 'yellow';
        statusElement.innerText = 'Salvando dados da música...';

        try {
            await db.collection("musicasBanda").add({
                nome: nome,
                spotifyLink: spotifyLink,
                imagem: imagem,
                criadoEm: firebase.firestore.FieldValue.serverTimestamp()
            });
            statusElement.style.color = 'lightgreen';
            statusElement.innerText = 'Música cadastrada com sucesso!';
            document.getElementById('formCadastroMusica').reset();
        } catch (error) {
            console.error("Erro ao salvar no Firestore: ", error);
            statusElement.style.color = 'red';
            statusElement.innerText = 'Erro ao salvar dados da música. Verifique o console para mais detalhes.';
        }
    });
  </script>
  <script src="js/script.js"></script>

</body>
</html>
