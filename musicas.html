  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const musicasContainer = document.getElementById('musicasContainer');

        function createMusicCard(music) {
            let imagemHtml = '';
            if (music.imagem) {
                imagemHtml = `<img src="img/musicas/${music.imagem}" alt="${music.nome}" class="musica-imagem">`;
            }
            return `
                <div class="musica-card">
                    ${imagemHtml}
                    <h2>${music.nome}</h2>
                    <a href="${music.spotifyLink}" target="_blank" class="btn-spotify">
                        <i class="fa fa-music"></i> Ouvir aqui!
                    </a>
                </div>
            `;
        }

        async function fetchMusicas() {
            try {
                const snapshot = await db.collection("musicasBanda").orderBy("criadoEm", "desc").get();
                let musicasHtml = '';
                if (snapshot.empty) {
                    musicasHtml = '<p style="color: white;">Nenhuma música encontrada. Aguarde novas atualizações da equipe!</p>';
                } else {
                    snapshot.forEach(doc => {
                        const music = doc.data();
                        musicasHtml += createMusicCard(music);
                    });
                }
                musicasContainer.innerHTML = musicasHtml;
            } catch (error) {
                console.error("Erro ao buscar músicas: ", error);
                musicasContainer.innerHTML = '<p style="color: red;">Erro ao carregar músicas. Verifique sua conexão com o Firebase e regras de segurança (read: true).</p>';
            }
        }

        fetchMusicas();
    });
  </script>
